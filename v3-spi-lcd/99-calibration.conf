# /usr/share/X11/xorg.conf.d/99-calibration.conf に配置する。
# OSOYOO公式手順のデフォルト値。実際のタッチ精度がズレる場合は
# xinput_calibrator を実行して出てきた値に置き換えること
# (sudo apt install -y xinput-calibrator; xinput_calibrator)。
#
# MatchProductは"ADS7846 Touchscreen"となっているが、実機で
# `dmesg | grep -i touch` や `xinput list` を見て実際のデバイス名が
# 違っていたら、その名前に書き換えること(XPT2046搭載パネルでも
# Linuxカーネル側はADS7846ドライバ名で認識されることが多い)。
Section "InputClass"
    Identifier "calibration"
    MatchProduct "ADS7846 Touchscreen"
    Option "Calibration" "241 3854 3885 240"
    Option "SwapAxes" "1"
EndSection
